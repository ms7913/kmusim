<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bärtschi Metalltech AG – Führungssimulation</title>
<style>
:root{
  --papier:#E9EBE7; --flaeche:#FFFFFF; --tinte:#16202B; --stahl:#5E6B76;
  --linie:#C6CBC5; --signal:#E8B400; --blau:#1F5C8B; --rot:#A32C24; --gruen:#2E6B4F;
  /* Postfach-Chrome */
  --chrome:#f0f0f4; --chrome-dunkel:#e3e3e8; --rand:#cfcfd8; --rand-hell:#e6e6ec;
  --mtext:#15141a; --mgrau:#5b5b66; --auswahl:#0a84ff; --auswahl-hell:#dceafd; --mhover:#f2f5fb;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papier);color:var(--tinte);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ================= Kopf ================= */
header.app{background:var(--tinte);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:20px;align-items:baseline;position:sticky;top:0;z-index:30}
header.app h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-0.01em}
header.app .ort{color:#93A2AE;font-size:13px}
header.app .periode{margin-left:auto;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
header.app .periode small{font-size:12px;font-weight:400;color:#93A2AE;display:block;text-align:right}

#warnbalken{display:none;align-items:center;gap:14px;padding:10px 20px;background:repeating-linear-gradient(135deg,var(--signal) 0 18px,#1a1a1a 18px 36px);color:#fff;font-weight:600;font-size:14px}
#warnbalken span{background:#1a1a1a;padding:4px 12px}
#warnbalken.sichtbar{display:flex}

#kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--linie);border-bottom:1px solid var(--linie)}
.kz{background:var(--flaeche);padding:11px 15px;cursor:pointer;text-align:left;border:0;font:inherit;color:inherit;width:100%}
.kz:hover{background:#F5F7F4}
.kz:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--blau)}
.kz .titel{font-size:12px;color:var(--stahl)}
.kz .wert{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;margin-top:2px}
.kz .wert.gut{color:var(--gruen)} .kz .wert.schlecht{color:var(--rot)}
.kz .formel{display:none;font-size:12px;color:var(--stahl);margin-top:6px;border-top:1px dashed var(--linie);padding-top:6px}
.kz.offen .formel{display:block}

nav.app{display:flex;background:var(--flaeche);border-bottom:1px solid var(--linie);overflow-x:auto;position:sticky;top:0;z-index:20}
nav.app button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 17px;font:inherit;font-size:14px;color:var(--stahl);cursor:pointer;white-space:nowrap;position:relative}
nav.app button:hover{color:var(--tinte)}
nav.app button.aktiv{color:var(--tinte);font-weight:600;border-bottom-color:var(--signal)}
nav.app button .punkt{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:9px;background:var(--rot);color:#fff;font-size:11px;font-weight:700;text-align:center;margin-left:6px;padding:0 4px}

main{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
main.breit{max-width:none;padding:0}
h2{font-size:19px;font-weight:600;margin:0 0 14px;letter-spacing:-0.01em}
h3{font-size:15px;font-weight:600;margin:26px 0 8px}
p.hinweis{color:var(--stahl);font-size:14px;max-width:66ch;margin:0 0 18px}

table.d{width:100%;border-collapse:collapse;background:var(--flaeche);font-variant-numeric:tabular-nums}
table.d th,table.d td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--linie);font-size:14px}
table.d td.z,table.d th.z{text-align:right}
table.d tr.summe td{font-weight:600;border-top:2px solid var(--tinte);border-bottom:0}
table.d tr.zwischen td{font-weight:600;background:#F5F7F4}
table.d tr.knapp td{color:var(--rot)}
table.d caption{text-align:left;font-weight:600;padding:10px 12px;background:var(--tinte);color:#fff;font-size:14px}
.tabellen{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}

.karte{background:var(--flaeche);border:1px solid var(--linie);margin-bottom:20px}
.karte .kartenkopf{background:#F5F7F4;padding:12px 16px;border-bottom:1px solid var(--linie)}
.karte .kartenkopf.fuehrung{background:#F3F0E4;border-bottom-color:var(--signal)}
.karte .titel{font-weight:600;font-size:15px}
.karte .hkb{font-size:12px;color:var(--stahl);margin-top:3px}
.karte .rumpf{padding:16px}
.karte .lage{margin:0 0 14px;max-width:68ch}
blockquote.zitat{margin:0 0 14px;padding:12px 16px;background:#F5F7F4;border-left:3px solid var(--stahl);max-width:66ch}
blockquote.zitat cite{display:block;margin-top:6px;font-size:13px;font-style:normal;color:var(--stahl)}
.optionen{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--linie);padding:11px 13px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--stahl)}
.opt input{margin-top:3px}
.opt.gewaehlt{border-color:var(--blau);background:#F1F6FA}
.opt .folge{display:block;font-size:13px;color:var(--stahl);margin-top:2px}
.begruendung{margin-top:14px}
.begruendung label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.begruendung textarea{width:100%;min-height:76px;padding:9px 11px;border:1px solid var(--linie);font:inherit;font-size:14px;resize:vertical;background:#fff;color:var(--tinte)}
.begruendung textarea:focus{outline:2px solid var(--blau);outline-offset:-1px;border-color:var(--blau)}
.zaehler{font-size:12px;color:var(--stahl);margin-top:4px}
.zaehler.fehlt{color:var(--rot)}
.vermerk{background:#F1F6FA;border-left:3px solid var(--blau);padding:9px 13px;font-size:13px;margin:0 0 14px}

.regler{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.regler .feld{background:var(--flaeche);border:1px solid var(--linie);padding:14px 16px}
.regler label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.regler .erklaerung{font-size:13px;color:var(--stahl);margin-bottom:10px}
.regler input[type=range]{width:100%}
.regler select,.regler input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--linie);font:inherit;font-size:14px;background:#fff;color:var(--tinte)}
.regler .anzeige{font-weight:600;font-variant-numeric:tabular-nums}
.regler .kosten{font-size:13px;color:var(--stahl);margin-top:6px}
.schalter{display:flex;gap:9px;align-items:flex-start;font-size:14px;font-weight:400}
.balken{height:8px;background:var(--linie);margin-top:8px;position:relative}
.balken i{position:absolute;left:0;top:0;bottom:0;background:var(--gruen)}
.balken i.mittel{background:var(--signal)} .balken i.tief{background:var(--rot)}

.knopf{background:var(--blau);color:#fff;border:0;padding:11px 20px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.knopf:hover{background:#17486D}
.knopf:disabled{background:#B4BCC2;cursor:not-allowed}
.knopf.neben{background:none;color:var(--blau);border:1px solid var(--blau)}
.knopf.neben:hover{background:#F1F6FA}
.knopf.klein{padding:6px 14px;font-size:13px}
.knopfleiste{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px}
.knopfleiste .status{font-size:13px;color:var(--stahl)}

.eintrag{background:var(--flaeche);border-left:3px solid var(--signal);padding:13px 16px;margin-bottom:12px}
.eintrag.c{border-left-color:var(--blau)}
.eintrag.p{border-left-color:var(--stahl)}
.eintrag .kopf{font-size:12px;color:var(--stahl);margin-bottom:4px}
.eintrag .was{font-weight:600;font-size:14px}
.eintrag .warum{margin:6px 0 0;font-size:14px;max-width:68ch}
.meldung{background:var(--flaeche);border-left:3px solid var(--stahl);padding:11px 15px;margin-bottom:9px;font-size:14px}
.meldung.gut{border-left-color:var(--gruen)}
.meldung.schlecht{border-left-color:var(--rot)}
.meldung.personal{border-left-color:var(--blau)}
.leer{color:var(--stahl);font-size:14px;background:var(--flaeche);border:1px dashed var(--linie);padding:24px;text-align:center}

/* ================= Postfach ================= */
#postfach{display:flex;flex-direction:column;height:calc(100vh - 108px);min-height:520px;background:var(--chrome);color:var(--mtext);font-size:13.5px}
#postfach .werkzeugleiste{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--chrome);border-bottom:1px solid var(--rand);flex:none;flex-wrap:wrap}
#postfach .wz{display:inline-flex;align-items:center;gap:6px;background:none;border:0;border-radius:4px;padding:6px 10px;font:inherit;font-size:13px;color:var(--mtext);cursor:pointer}
#postfach .wz:hover{background:var(--chrome-dunkel)}
#postfach .wz:disabled{color:#a5a5b0;cursor:default;background:none}
#postfach .wz svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#postfach .trenner{width:1px;height:20px;background:var(--rand);margin:0 3px}
#postfach .uhr{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--mgrau);font-variant-numeric:tabular-nums}
#postfach .uhr b{font-size:15px;color:var(--mtext)}
#postfach .uhr.knapp b{color:var(--rot)}
#postfach .schnellfilter{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--chrome);border-bottom:1px solid var(--rand);flex:none;flex-wrap:wrap}
#postfach .pille{background:#fff;border:1px solid var(--rand);border-radius:3px;padding:4px 11px;font:inherit;font-size:12.5px;color:var(--mtext);cursor:pointer}
#postfach .pille:hover{background:var(--mhover)}
#postfach .pille[aria-pressed="true"]{background:var(--auswahl);border-color:var(--auswahl);color:#fff}
#postfach .suche{flex:1;min-width:130px;padding:5px 10px;border:1px solid var(--rand);border-radius:3px;font:inherit;font-size:12.5px;background:#fff;color:var(--mtext)}
#postfach .fenster{flex:1;display:grid;grid-template-columns:208px 1fr;min-height:0}
#postfach .ordner{background:var(--chrome);border-right:1px solid var(--rand);overflow-y:auto;padding:8px 0}
#postfach .konto{padding:6px 12px;font-weight:600;font-size:12.5px;display:flex;gap:7px;align-items:flex-start}
#postfach .konto small{display:block;font-weight:400;color:var(--mgrau);font-size:11.5px}
#postfach .ordnerzeile{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 26px;font-size:13px}
#postfach .ordnerzeile.aktiv{background:var(--auswahl-hell);font-weight:600}
#postfach .ordnerzeile .anzahl{margin-left:auto;color:var(--mgrau);font-size:12px;font-variant-numeric:tabular-nums}
#postfach .ordnerzeile.aktiv .anzahl{color:var(--auswahl)}
#postfach .ordnerzeile svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
#postfach .rechts{display:grid;grid-template-rows:minmax(140px,36%) 6px 1fr;min-height:0;background:#fff}
#postfach .liste{overflow-y:auto;background:#fff}
#postfach .griff{background:var(--chrome-dunkel);border-top:1px solid var(--rand);border-bottom:1px solid var(--rand)}
#postfach table.m{width:100%;border-collapse:collapse}
#postfach table.m th{position:sticky;top:0;background:var(--chrome);border-bottom:1px solid var(--rand);font-size:11.5px;font-weight:600;color:var(--mgrau);text-align:left;padding:5px 8px;z-index:2}
#postfach table.m td{padding:5px 8px;border-bottom:1px solid var(--rand-hell);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
#postfach table.m tr:hover td{background:var(--mhover)}
#postfach tr.ungelesen td{font-weight:700}
#postfach tr.gewaehlt td,#postfach tr.gewaehlt:hover td{background:var(--auswahl);color:#fff}
#postfach tr.gewaehlt .von,#postfach tr.gewaehlt .datum{color:#dbe9fb}
#postfach tr.erledigt .betreff{text-decoration:line-through;opacity:.65}
#postfach .stern{width:24px;text-align:center;cursor:pointer;color:#c9c9d2;font-size:14px}
#postfach .stern.an{color:#e8b400}
#postfach tr.gewaehlt .stern{color:#8fc0f5} #postfach tr.gewaehlt .stern.an{color:#ffd75e}
#postfach .von,#postfach .datum{color:var(--mgrau)}
#postfach .datum{font-variant-numeric:tabular-nums;text-align:right;width:74px}
#postfach .tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;margin-right:6px;vertical-align:1px}
#postfach .tag.a{background:#fbe4e7;color:#d7263d}
#postfach .tag.b{background:#fdefdb;color:#e07b00}
#postfach .tag.c{background:#e3f1e9;color:#1a7f4b}
#postfach .tag.e{background:#e6e2f7;color:#6b3fa0}
#postfach tr.gewaehlt .tag{background:rgba(255,255,255,.22);color:#fff}
#postfach .lesen{overflow-y:auto;background:#fff}
#postfach .betreffzeile{padding:12px 20px 0;font-size:16px;font-weight:600;line-height:1.35}
#postfach .kopfblock{padding:12px 20px;border-bottom:1px solid var(--rand-hell);display:flex;gap:14px}
#postfach .avatar{width:38px;height:38px;border-radius:50%;background:#5b6b7d;color:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
#postfach .zeile1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#postfach .absender{font-weight:600}
#postfach .adresse{color:var(--mgrau);font-size:12.5px}
#postfach .wann{margin-left:auto;color:var(--mgrau);font-size:12.5px;white-space:nowrap}
#postfach .an{color:var(--mgrau);font-size:12.5px;margin-top:2px}
#postfach .koerper{padding:12px 20px 20px;font-size:14px;line-height:1.6;max-width:74ch;white-space:pre-line}
#postfach .koerper .signatur{color:var(--mgrau);font-size:13px;margin-top:14px;padding-top:10px;border-top:1px solid var(--rand-hell);white-space:pre-line}
#postfach .antwortleiste{display:flex;gap:6px;padding:0 20px 14px;flex-wrap:wrap}
#postfach .antwortleiste .wz{border:1px solid var(--rand);background:#fff}
#postfach .band{background:#f7f7fb;border-top:1px solid var(--rand);padding:14px 20px 22px}
#postfach .band h4{margin:0 0 3px;font-size:13.5px}
#postfach .band p.h{margin:0 0 12px;color:var(--mgrau);font-size:12.5px;max-width:70ch}
#postfach .feldreihe{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
#postfach .feld > span{display:block;font-size:12px;color:var(--mgrau);margin-bottom:5px}
#postfach .wahlreihe{display:flex;gap:5px;flex-wrap:wrap}
#postfach .wahl{background:#fff;border:1px solid var(--rand);border-radius:3px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--mtext)}
#postfach .wahl:hover{background:var(--mhover)}
#postfach .wahl[aria-pressed="true"]{background:var(--auswahl);border-color:var(--auswahl);color:#fff}
#postfach .wahl.a[aria-pressed="true"]{background:#d7263d;border-color:#d7263d}
#postfach .wahl.b[aria-pressed="true"]{background:#e07b00;border-color:#e07b00}
#postfach .wahl.c[aria-pressed="true"]{background:#1a7f4b;border-color:#1a7f4b}
#postfach .band textarea{width:100%;max-width:74ch;min-height:62px;padding:8px 10px;border:1px solid var(--rand);border-radius:3px;font:inherit;font-size:13.5px;resize:vertical;background:#fff;color:var(--mtext)}
#postfach .band textarea:focus{outline:2px solid var(--auswahl);outline-offset:-1px;border-color:var(--auswahl)}
#postfach .band .zaehler{font-size:11.5px;color:var(--mgrau);margin-top:4px}
#postfach .band .zaehler.fehlt{color:#d7263d}
#postfach .entscheidhinweis{background:#efe9fa;border-left:3px solid #6b3fa0;padding:9px 13px;font-size:13px;margin:0 20px 14px}
#postfach .leerfenster{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mgrau);font-size:13.5px;padding:30px;text-align:center}
#postfach .statusleiste{flex:none;display:flex;align-items:center;gap:14px;padding:5px 12px;background:var(--chrome);border-top:1px solid var(--rand);font-size:12px;color:var(--mgrau);flex-wrap:wrap}
#postfach .fortschritt{margin-left:auto;display:flex;align-items:center;gap:9px}
#postfach .leiste{width:110px;height:7px;background:var(--rand);border-radius:4px;overflow:hidden}
#postfach .leiste i{display:block;height:100%;background:var(--auswahl)}

/* Auswertung */
#auswertung{position:fixed;inset:0;background:rgba(20,20,26,.45);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;z-index:60}
#auswertung.offen{display:flex}
#auswertung .blatt{background:#fff;max-width:840px;width:100%;border-radius:6px;padding:26px 30px 30px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#auswertung h2{margin:0 0 6px}
#auswertung p.lead{margin:0 0 20px;color:var(--stahl);font-size:14px;max-width:70ch}
.befund{border-left:3px solid var(--linie);padding:11px 15px;margin-bottom:11px;background:#fafafb;font-size:14px}
.befund.gut{border-left-color:var(--gruen)} .befund.schlecht{border-left-color:var(--rot)}
.befund b{display:block;margin-bottom:2px}
#auswertung table{width:100%;border-collapse:collapse;margin-top:18px}
#auswertung th,#auswertung td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--rand-hell);font-size:13px;vertical-align:top}
#auswertung th{color:var(--stahl);font-size:11.5px}

@media (max-width:820px){
  header.app .periode{font-size:18px;margin-left:0;width:100%}
  main{padding:16px 12px 60px}
  #postfach .fenster{grid-template-columns:1fr}
  #postfach .ordner{display:none}
  #postfach{height:calc(100vh - 96px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="app">
  <div>
    <h1>Bärtschi Metalltech AG</h1>
    <div class="ort">Blech- und Metallbearbeitung · Lyss BE</div>
  </div>
  <div class="periode" id="periodeAnzeige"></div>
</header>

<div id="warnbalken"><span id="warntext"></span></div>
<div id="kennzahlen"></div>

<nav class="app" id="reiterleiste"></nav>
<main id="inhalt"></main>
<div id="auswertung"><div class="blatt" id="blatt"></div></div>

<script>
"use strict";

/* ===================================================================
   1) FESTWERTE
   =================================================================== */
const K = {
  erloesProStunde:230, materialProStunde:94.35, lohnkostenProMaJahr:85940,
  betriebsaufwandQuartal:787500, abschreibungQuartal:295000,
  stundenProMaQuartal:387.5, anteilSchweissen:0.234,
  zinsHypothek:0.019, zinsDarlehen:0.024, zinsKontokorrent:0.045,
  kkLimite:2000000, amortisationQuartal:100000, steuersatz:0.155,
  preiselastizitaet:-1.4, ueberzeitAnsatz:45, kostenAusschreibung:8500,
  einarbeitungQuartale:2, postkorbMinuten:30
};
const SOLL = {laser:20, abkanten:16, schweissen:22, oberflaechen:8, montage:15};
const QUARTALE = ["Q1 20X5","Q2 20X5","Q3 20X5","Q4 20X5","Q1 20X6","Q2 20X6","Q3 20X6","Q4 20X6"];
const MARKT = [1.00,1.02,0.97,1.04,1.03,1.05,0.99,1.06];

const r3 = n => +n.toFixed(3);
const grenze = (n,a,b) => Math.min(b,Math.max(a,n));
const fmt = n => Math.round(n).toLocaleString("de-CH").replace(/\u202F|\u00A0/g,"'");
const pct = (n,k=1) => (n*100).toFixed(k)+" %";

function startZustand(){
  return {
    periode:0,
    kasse:1250000, forderungen:4100000, vorraete:4350000, uebrigesUV:400000,
    anlagevermoegen:13500000, verbindlichkeiten:2350000, kontokorrent:900000,
    uebrigesKFK:1550000, hypothek:4200000, darlehen:1800000,
    langfrRueckstellungen:400000, eigenkapital:12400000,
    personal:{laser:20, abkanten:16, schweissen:18, oberflaechen:8, montage:15},

const AKTIONSNAME = Object.fromEntries(AKTIONEN.map(a=>[a.id,a.label]));

/* Postkorb der laufenden Periode: Ereignismails + Zusatzpost, nach Zeit sortiert */
function postkorbListe(){
  const p = S.periode;
  const aus = EREIGNISSE.filter(e=>e.periode===p).map(e=>({
    id:e.id, ereignis:true, von:e.von, adresse:e.adresse, zeit:e.zeit,
    betreff:e.titel, koerper:e.mail, signatur:e.signatur, muster:e.muster, markiert:!!e.markiert
  }));
  const zus = ZUSATZPOST.filter(z=>z.periode===p).map(z=>({
    id:z.id, ereignis:false, von:z.von, adresse:z.adresse, zeit:z.zeit,
    betreff:z.betreff, koerper:z.koerper, signatur:z.signatur, muster:z.muster,
    stoerung:!!z.stoerung, widerspruch:z.widerspruch, markiert:false
  }));
  const alle = aus.concat(zus);
  const rang = t => (t.startsWith("Mi")?0:t.startsWith("Do")?1:t.startsWith("Fr")?2:10) * 10000
                    + parseInt(t.replace(/\D/g,"").slice(-4)||"0",10);
  return alle.sort((a,b)=>rang(a.zeit)-rang(b.zeit));
}

function produktivePersonen(){const p=S.personal;return p.laser+p.abkanten+p.schweissen+p.oberflaechen+p.montage;}
function gesamtPersonal(){return produktivePersonen()+S.verwaltung+S.lernende;}
function offeneStellen(){let n=0;for(const b in SOLL)n+=Math.max(0,SOLL[b]-S.personal[b]);return n;}
function kapazitaet(){
  const anwesenheit = 1-(S.absenzquote-0.034);
  let roh = produktivePersonen()*K.stundenProMaQuartal*anwesenheit;
  if(S.zweiSchicht) roh*=1.18;
  const schweiss = S.personal.schweissen*K.stundenProMaQuartal*anwesenheit*(S.zweiSchicht?1.10:1);
  return Math.min(roh, schweiss/K.anteilSchweissen);
}
function nachfrage(f){
  const preiseffekt = 1+K.preiselastizitaet*(S.preisindex-1);
  const marketing = 1+(S.marketingQuartal-99000)/99000*0.05;
  return 31000*f*Math.max(0.3,preiseffekt)*S.reputation*marketing;
}

function personalPeriode(m){
  S.inEinarbeitung.forEach(e=>e.rest--);
  const fertig = S.inEinarbeitung.filter(e=>e.rest<=0);
  fertig.forEach(e=>S.personal[e.bereich]++);
  S.inEinarbeitung = S.inEinarbeitung.filter(e=>e.rest>0);
  if(fertig.length) m.push({art:"personal", text:fertig.length+" eingearbeitete Person"+(fertig.length>1?"en sind":" ist")+" jetzt voll einsatzfähig."});

  let dm = 0;
  dm -= Math.max(0,S.ueberzeitSaldo-3500)/45000;
  dm += (S.lohnindex-1)*0.9;
  dm += (S.weiterbildungQuartal-24000)/24000*0.02;
  dm -= Math.max(0,S.auslastung-0.95)*0.6;
  dm += S.motivationBonus;
  S.motivation = grenze(S.motivation + dm*0.6 + (0.72-S.motivation)*0.10, 0.30, 0.96);
  S.motivationBonus = 0;

  S.absenzquote = grenze(0.028+(0.80-S.motivation)*0.075, 0.020, 0.095);
  S.fluktuation = grenze(0.070+(0.80-S.motivation)*0.30, 0.040, 0.260);

  const abgang = Math.round(produktivePersonen()*S.fluktuation/4);
  const bereiche = Object.keys(S.personal);
  for(let i=0;i<abgang;i++){
    bereiche.sort((a,b)=>S.personal[b]-S.personal[a]);
    if(S.personal[bereiche[0]]>3) S.personal[bereiche[0]]--;
  }
  if(abgang>0){
    m.push({art:abgang>3?"schlecht":"personal", text:abgang+" Mitarbeitende haben den Betrieb verlassen (Fluktuation "+pct(S.fluktuation)+" pro Jahr). Wissen geht mit."});
    S.knowhow -= abgang*0.012;
  }

  const offen = offeneStellen();
  const ausschr = Math.min(S.ausschreibungen, offen);
  if(ausschr>0){
    S.einmalkosten += ausschr*K.kostenAusschreibung;
    const quote = grenze(0.30+(S.lohnindex-1)*4+(S.motivation-0.72)*0.8+(S.rekrutierungsbonus||0), 0.05, 0.95);
    const treffer = Math.round(ausschr*quote);
    for(let i=0;i<treffer;i++){
      let ziel=null, luecke=0;
      for(const b in SOLL){
        const l = SOLL[b]-S.personal[b]-S.inEinarbeitung.filter(e=>e.bereich===b).length;
        if(l>luecke){luecke=l; ziel=b;}
      }
      if(ziel) S.inEinarbeitung.push({bereich:ziel, rest:K.einarbeitungQuartale});
    }
    m.push(treffer>0
      ? {art:"gut", text:treffer+" Zusage"+(treffer>1?"n":"")+" bei "+ausschr+" ausgeschriebenen Stellen (Erfolgsquote "+pct(quote,0)+"). Einarbeitung: zwei Quartale."}
      : {art:"schlecht", text:"Keine Zusage auf "+ausschr+" ausgeschriebene Stellen. Erfolgsquote nur "+pct(quote,0)+" – Lohnniveau und Ruf als Arbeitgeber wirken hier direkt."});
    S.rekrutierungsbonus = 0;
  }

  S.knowhow = grenze(S.knowhow+0.004+(S.weiterbildungQuartal-24000)/24000*0.012+S.knowhowBonus, 0.70, 1.20);
  S.knowhowBonus = 0;
  S.ausschussEffektiv = grenze(S.ausschuss+(1-S.knowhow)*0.06+S.inEinarbeitung.length*0.002, 0.005, 0.14);

  if(S.auslastung>0.90) S.ueberzeitSaldo += (S.auslastung-0.90)*kapazitaet()*0.55;
  else S.ueberzeitSaldo = Math.max(0, S.ueberzeitSaldo-(0.90-S.auslastung)*kapazitaet()*0.35);
  let uzKosten = 0;
  if(S.ueberzeitAuszahlen && S.ueberzeitSaldo>0){
    uzKosten = S.ueberzeitSaldo*K.ueberzeitAnsatz;
    m.push({art:"personal", text:"Überzeit im Umfang von "+fmt(S.ueberzeitSaldo)+" Stunden ausbezahlt: CHF "+fmt(uzKosten)+"."});
    S.ueberzeitSaldo = 0; S.ueberzeitAuszahlen = false;
  }
  if(S.ueberzeitSaldo>6500) m.push({art:"schlecht", text:"Überzeitsaldo "+fmt(S.ueberzeitSaldo)+" Stunden – eine Verbindlichkeit gegenüber den Mitarbeitenden, die auf die Motivation drückt."});
  if(S.motivation<0.55) m.push({art:"schlecht", text:"Die Stimmung ist schlecht (Motivationsindex "+pct(S.motivation,0)+"). Absenzen und Fluktuation steigen weiter."});
  if(S.motivation>0.85) m.push({art:"gut", text:"Die Stimmung ist gut (Motivationsindex "+pct(S.motivation,0)+")."});
  return uzKosten;
}

function periodeRechnen(){
  const m = [];
  const uzKosten = personalPeriode(m);
  const kap = kapazitaet();
  const nach = nachfrage(MARKT[S.periode]);
  const verkaufte = Math.min(kap,nach);
  const auslastung = kap>0 ? verkaufte/kap : 0;

  let tt = 0.96 - Math.max(0,auslastung-0.88)*1.2 - (S.ausschussEffektiv-0.024)*2
           + (S.motivation-0.72)*0.18 + (S.termintreueBonus||0);
  tt = grenze(tt,0.66,0.99);
  S.termintreue = tt; S.auslastung = auslastung;

  const umsatz = verkaufte*K.erloesProStunde*S.preisindex;
  const material = verkaufte*K.materialProStunde*(1-(S.materialrabatt||0));
  const personal = gesamtPersonal()*K.lohnkostenProMaJahr*S.lohnindex/4 + (S.zweiSchicht?95000:0) + uzKosten + S.weiterbildungQuartal;
  const uebrig = K.betriebsaufwandQuartal + S.energiezuschlag + S.zusatzFixkosten + (S.marketingQuartal-99000) + S.einmalkosten;
  const abschreibung = K.abschreibungQuartal + S.zusatzAbschreibung;
  const zinsen = (S.hypothek*K.zinsHypothek + S.darlehen*K.zinsDarlehen + Math.max(0,S.kontokorrent)*K.zinsKontokorrent)/4;
  const ebitda = umsatz-material-personal-uebrig;
  const ebit = ebitda-abschreibung;
  const vorSteuern = ebit-zinsen;
  const steuern = vorSteuern>0 ? vorSteuern*K.steuersatz : 0;
  const gewinn = vorSteuern-steuern;
  S.einmalkosten = 0;

  const fordNeu = umsatz*(S.zahlungszielTage/90);
  const ein = S.forderungen + umsatz - fordNeu;
  const aus = material+personal+uebrig+zinsen+steuern+K.amortisationQuartal;
  S.forderungen = fordNeu;
  S.kasse += ein-aus;
  S.darlehen = Math.max(0,S.darlehen-K.amortisationQuartal);

  if(S.kasse<150000){
    S.kontokorrent += 150000-S.kasse; S.kasse = 150000;
    if(S.kontokorrent>K.kkLimite) m.push({art:"schlecht", text:"Die Kontokorrentlimite von CHF 2'000'000 ist überschritten. Die Bank verlangt ein Gespräch."});
    else if(S.kontokorrent>K.kkLimite*0.8) m.push({art:"schlecht", text:"Der Kontokorrent ist zu über 80 % beansprucht."});
  } else if(S.kasse>900000 && S.kontokorrent>0){
    const t = Math.min(S.kasse-600000,S.kontokorrent);
    S.kontokorrent -= t; S.kasse -= t;
  }

  S.anlagevermoegen -= abschreibung;
  S.eigenkapital += gewinn;
  S.reputation = grenze(S.reputation+(tt-0.93)*0.9, 0.82, 1.18);

  if(auslastung>0.97) m.push({art:"schlecht", text:"Die Werkstatt läuft am Anschlag. Termintreue "+pct(tt,0)+", der Überzeitsaldo wächst."});
  if(auslastung<0.72) m.push({art:"schlecht", text:"Nur "+pct(auslastung,0)+" Auslastung. Die Fixkosten verteilen sich auf zu wenige Stunden."});
  if(nach>kap*1.05) m.push({art:"", text:fmt(nach-kap)+" Stunden Nachfrage konnten nicht bedient werden und gingen an den Wettbewerb."});
  if(gewinn<0) m.push({art:"schlecht", text:"Quartalsverlust von CHF "+fmt(Math.abs(gewinn))+"."});
  if(gewinn>250000) m.push({art:"gut", text:"Solides Quartal mit CHF "+fmt(gewinn)+" Gewinn."});
  if(offeneStellen()>0) m.push({art:"", text:offeneStellen()+" Stellen unbesetzt, davon "+Math.max(0,SOLL.schweissen-S.personal.schweissen)+" in der Schweisserei – dem Engpass des Betriebs."});

  S.meldungen = m;
  S.ergebnisse.push({quartal:QUARTALE[S.periode], auslastung, umsatz, material, personal, uebrig,
    ebitda, abschreibung, ebit, zinsen, gewinn, kasse:S.kasse, kontokorrent:S.kontokorrent,
    eigenkapital:S.eigenkapital, termintreue:tt, motivation:S.motivation, fluktuation:S.fluktuation,
    absenzquote:S.absenzquote, ueberzeit:S.ueberzeitSaldo, personen:gesamtPersonal()});
}

function mailListeZeichnen(){
  const ziel = document.getElementById("mailListe");
  if(!ziel) return;
  const zeilen = postkorbListe().filter(n=>{
    if(S.archiviert.includes(n.id)) return false;
    if(mailFilter.ungelesen && S.gelesen.includes(n.id)) return false;
    if(mailFilter.markiert && !n.markiert) return false;
    if(mailFilter.offen && pkFertig(n.id)) return false;
    if(mailFilter.text){
      const t = mailFilter.text.toLowerCase();
      if(!(n.betreff+" "+n.von+" "+n.koerper).toLowerCase().includes(t)) return false;
    }
    return true;
  });
  ziel.innerHTML = zeilen.length ? zeilen.map(n=>{
    const b = S.postkorb[n.id]||{};
    const tags = (b.prio?`<span class="tag ${b.prio.toLowerCase()}">Priorität ${b.prio}</span>`:"")
               + (n.ereignis?`<span class="tag e">Entscheid</span>`:"");
    return `<tr data-id="${n.id}" class="${S.gelesen.includes(n.id)?"":"ungelesen"} ${mailGewaehlt===n.id?"gewaehlt":""} ${pkFertig(n.id)?"erledigt":""}">
      <td class="stern ${n.markiert?"an":""}" data-stern="${n.id}">${n.markiert?"★":"☆"}</td>
      <td>${tags}<span class="betreff">${n.betreff}</span></td>
      <td class="von">${n.von}</td><td class="datum">${n.zeit}</td></tr>`;
  }).join("") : `<tr><td colspan="4" style="padding:22px;text-align:center;color:var(--mgrau);white-space:normal">Keine Nachricht entspricht dem Filter.</td></tr>`;

  ziel.querySelectorAll("tr[data-id]").forEach(tr=>{
    tr.onclick = e=>{ if(!e.target.dataset.stern) mailOeffnen(tr.dataset.id); };
  });
  ziel.querySelectorAll("[data-stern]").forEach(td=>{
    td.onclick = e=>{
      e.stopPropagation();
      const n = postkorbListe().find(x=>x.id===td.dataset.stern);
      const q = EREIGNISSE.find(x=>x.id===n.id);
      if(q) q.markiert = !q.markiert; else n.markiert = !n.markiert;
      S.sterne = S.sterne||{}; S.sterne[n.id] = !S.sterne[n.id];
      mailListeZeichnen();
    };
  });
  mailStatusZeichnen();
}

  s1.textContent = `Posteingang ${QUARTALE[S.periode]} – ${st.total-S.archiviert.length} Nachrichten, ${st.ungelesen} ungelesen`;
  document.getElementById("mailFortschritt").textContent = `${st.fertig} von ${st.total} bearbeitet`;
  document.getElementById("mailBalken").style.width = (st.fertig/st.total*100)+"%";
  document.getElementById("ordnerUngelesen").textContent = st.ungelesen||"";

}

  });

function uhrTicken(){
  if(!uhrLaeuft) return;
  restSekunden--;
  const el = document.getElementById("restzeit");
  if(el){
    el.textContent = Math.floor(restSekunden/60)+":"+String(restSekunden%60).padStart(2,"0");
    document.getElementById("uhr").classList.toggle("knapp", restSekunden<=300);
  }
  if(restSekunden<=0){ uhrLaeuft=false; postkorbAuswerten(true); }
}
if(!uhrHandle) uhrHandle = setInterval(uhrTicken,1000);

/* ---------- Postkorb-Auswertung ---------- */
function postkorbAuswerten(zeitAus){
  uhrLaeuft = false;
  const liste = postkorbListe();
  const befunde = [];
  const zaehl = {A:0,B:0,C:0};
  liste.forEach(n=>{ const b=S.postkorb[n.id]; if(b&&b.prio) zaehl[b.prio]++; });

  // Widersprüche
  const paare = [];
  liste.forEach(n=>{ if(n.widerspruch && !paare.some(p=>p.includes(n.id))) paare.push([n.id,n.widerspruch]); });
  paare.forEach(([a,c])=>{
    const ba = S.postkorb[a]||{}, bc = S.postkorb[c]||{};
    const text = ((ba.notiz||"")+" "+(bc.notiz||"")).toLowerCase();
    const erkannt = /widerspr|gegensatz|abweich|unterschied|klär|klaer|prüf|pruef|gegenüber|nachfrag/.test(text);
    const beideHoch = ba.prio && bc.prio && ba.prio!=="C" && bc.prio!=="C";
    befunde.push(erkannt && beideHoch
      ? {art:"gut", titel:"Widersprüchliche Meldungen erkannt",
         text:"Zwei Nachrichten desselben Morgens beschreiben denselben Sachverhalt gegensätzlich. Sie haben beide beachtet und in der Begründung auf die Klärung verwiesen. Genau das ist die Kernaufgabe eines Postkorbs."}
      : {art:"schlecht", titel:"Ein Widerspruch blieb unbearbeitet",
         text:"«"+liste.find(x=>x.id===a).betreff+"» und «"+liste.find(x=>x.id===c).betreff+"» widersprechen sich. Wer auf dieser Grundlage handelt, entscheidet auf einer Information, die zur Hälfte falsch ist. Widersprüche zu erkennen und vor dem Handeln zu klären, ist der eigentliche Prüfungsgegenstand."});
  });

  // Ereignisse hoch genug?
  const ereignisse = liste.filter(n=>n.ereignis);
  const ereignisTief = ereignisse.filter(n=>(S.postkorb[n.id]||{}).prio==="C");
  befunde.push(ereignisTief.length===0
    ? {art:"gut", titel:"Entscheidungsbedarf richtig erkannt", text:"Alle Nachrichten, die einen Entscheid verlangen, sind mindestens auf B eingestuft."}
    : {art:"schlecht", titel:"Ein Entscheid wurde auf C gesetzt", text:ereignisTief.map(n=>"«"+n.betreff+"»").join(", ")+" verlangt einen Entscheid der Geschäftsleitung. Auf C eingestuft heisst faktisch: verschoben."});

  // Störgeräusche
  const stoer = liste.filter(n=>n.stoerung);
  if(stoer.length){
    const ok = stoer.every(n=>(S.postkorb[n.id]||{}).prio==="C" || S.archiviert.includes(n.id));
    befunde.push(ok
      ? {art:"gut", titel:"Nebengeräusche korrekt behandelt", text:"Nachrichten ohne Frist und ohne Handlungsbedarf tief einzustufen oder abzulegen, schafft Zeit für das Wesentliche."}
      : {art:"", titel:"Nicht jede Nachricht braucht Aufmerksamkeit", text:"Ein Postkorb enthält immer Material, dessen richtige Behandlung das Weglegen ist."});
  }

  if(zaehl.A>=Math.ceil(liste.length*0.6))
    befunde.push({art:"schlecht", titel:"Zu viele A-Prioritäten",
      text:zaehl.A+" von "+liste.length+" Nachrichten stehen auf A. Wenn fast alles oberste Priorität hat, ist nichts priorisiert."});

  const unbearbeitet = liste.filter(n=>!pkFertig(n.id)).length;
  if(unbearbeitet)
    befunde.push({art:"", titel:unbearbeitet+" Nachrichten blieben unbearbeitet",
      text:"Auch das ist eine Entscheidung – nur eine unausgesprochene. In der Prüfung zählt, was Sie schriftlich festhalten."});

  document.getElementById("blatt").innerHTML = `
    <h2>Auswertung des Postkorbs – ${QUARTALE[S.periode]}</h2>
    <p class="lead">${zeitAus?"Die 30 Minuten sind abgelaufen. ":""}${liste.length-unbearbeitet} von ${liste.length} Nachrichten vollständig bearbeitet, davon ${zaehl.A} auf Priorität A. Die Befunde sind Diskussionsanstösse fürs Debriefing, keine Punktzahl.</p>
    ${befunde.map(b=>`<div class="befund ${b.art}"><b>${b.titel}</b>${b.text}</div>`).join("")}
    <table><tr><th>Nachricht</th><th>Ihre Einstufung</th><th>Musterüberlegung</th></tr>
    ${liste.map(n=>{
      const b = S.postkorb[n.id]||{};
      return `<tr><td><b>${n.betreff}</b><br><span style="color:var(--stahl)">${n.von}</span></td>
        <td>${b.prio?`${b.prio} · ${AKTIONSNAME[b.aktion]||"keine Massnahme"}`:"nicht bearbeitet"}
        ${b.notiz?`<br><span style="color:var(--stahl)">${b.notiz}</span>`:""}</td>
        <td><b>${n.muster.prio} · ${AKTIONSNAME[n.muster.aktion]}</b><br>${n.muster.warum}</td></tr>`;
    }).join("")}</table>
    <div class="knopfleiste"><button class="knopf" id="auswZu">Zurück zum Postfach</button></div>`;
  document.getElementById("auswertung").classList.add("offen");
  document.getElementById("auswZu").onclick = ()=>document.getElementById("auswertung").classList.remove("offen");
}

function kennzahlenRendern(){
  const e = letzte(), bs = bilanzsumme();
  const liq2 = (S.kasse+S.forderungen+S.uebrigesUV)/kurzfristigesFK();
  const ekq = S.eigenkapital/bs;
  const d = [
    {t:"Flüssige Mittel", w:"CHF "+fmt(S.kasse), f:"Kassenbestand nach allen Ein- und Auszahlungen der Periode.", s:S.kasse<300000?"schlecht":""},
    {t:"EBIT-Marge", w:e?pct(e.ebit/e.umsatz):"–", f:"EBIT geteilt durch Nettoerlös. Branchenmittel 4 bis 6 %.", s:e?(e.ebit/e.umsatz>0.045?"gut":(e.ebit/e.umsatz<0.02?"schlecht":"")):""},
    {t:"Eigenkapitalquote", w:pct(ekq), f:"Eigenkapital "+fmt(S.eigenkapital)+" geteilt durch Bilanzsumme "+fmt(bs)+".", s:ekq>0.45?"gut":"schlecht"},
    {t:"Liquiditätsgrad 2", w:pct(liq2,0), f:"(Flüssige Mittel + Forderungen + übriges UV) durch kurzfristiges Fremdkapital. Richtwert 100 bis 120 %.", s:liq2<1?"schlecht":(liq2>1.1?"gut":"")},
    {t:"Auslastung", w:pct(S.auslastung,0), f:"Verkaufte Stunden durch Kapazität von "+fmt(kapazitaet())+" Stunden pro Quartal.", s:(S.auslastung>0.95||S.auslastung<0.75)?"schlecht":"gut"},
    {t:"Termintreue", w:pct(S.termintreue,0), f:"Ziel 96 %. Sinkt bei Überlastung und Ausschuss, steigt mit der Motivation.", s:S.termintreue>=0.94?"gut":(S.termintreue<0.90?"schlecht":"")},
    {t:"Motivationsindex", w:pct(S.motivation,0), f:"Wirkt auf Absenzen, Fluktuation, Qualität, Termintreue und die Erfolgsquote bei Rekrutierungen. Start 72 %.", s:S.motivation>=0.80?"gut":(S.motivation<0.60?"schlecht":"")},
    {t:"Fluktuation", w:pct(S.fluktuation), f:"Auf das Jahr gerechnet, folgt direkt der Motivation. Jeder Abgang kostet Wissen.", s:S.fluktuation<0.09?"gut":(S.fluktuation>0.15?"schlecht":"")},
    {t:"Überzeitsaldo", w:fmt(S.ueberzeitSaldo)+" h", f:"Wächst bei Auslastung über 90 %. Verbindlichkeit gegenüber den Mitarbeitenden.", s:S.ueberzeitSaldo>6000?"schlecht":(S.ueberzeitSaldo<3000?"gut":"")},
    {t:"Offene Stellen", w:String(offeneStellen()), f:"Gegenüber dem Sollbestand. In der Schweisserei begrenzt jede offene Stelle den Durchsatz des Betriebs.", s:offeneStellen()===0?"gut":(offeneStellen()>3?"schlecht":"")}
  ];
  document.getElementById("kennzahlen").innerHTML = d.map(x=>`
    <button class="kz"><div class="titel">${x.t}</div><div class="wert ${x.s}">${x.w}</div>
    <div class="formel">${x.f}</div></button>`).join("");
  document.querySelectorAll(".kz").forEach(b=>b.onclick=()=>b.classList.toggle("offen"));
}

function warnbalkenRendern(){
  const b = document.getElementById("warnbalken");
  const offen = offeneEreignisse().filter(ev=>{
    const w = S.wahl[ev.id];
    return !(w && w.option!==undefined && (w.begruendung||"").trim().length>=40);
  }).length;
  if(S.beendet || offen===0){ b.classList.remove("sichtbar"); return; }
  document.getElementById("warntext").textContent = offen===1 ? "1 Entscheid offen – mit Begründung" : offen+" Entscheide offen – je mit Begründung";
  b.classList.add("sichtbar");
}

function reiterRendern(){
  const st = pkStand();
  document.getElementById("reiterleiste").innerHTML = REITERNAMEN.map(([id,name])=>{
    const punkt = (id==="postkorb" && !S.beendet && st.total-st.fertig>0) ? `<span class="punkt">${st.total-st.fertig}</span>` : "";
    return `<button data-reiter="${id}" class="${aktiverReiter===id?"aktiv":""}">${name}${punkt}</button>`;
  }).join("");
  document.querySelectorAll("nav.app button").forEach(b=>b.onclick=()=>{aktiverReiter=b.dataset.reiter; zeichnen();});
}

function zeichnen(){
  document.getElementById("periodeAnzeige").innerHTML =
    (S.beendet?"Abgeschlossen":QUARTALE[S.periode]) +
    `<small>Periode ${Math.min(S.periode+1,8)} von 8 · ${gesamtPersonal()} Mitarbeitende</small>`;
  kennzahlenRendern(); warnbalkenRendern(); reiterRendern();
  const main = document.getElementById("inhalt");
  main.classList.toggle("breit", aktiverReiter==="postkorb");
  main.innerHTML = REITER[aktiverReiter]();
  verdrahten();
  if(aktiverReiter==="postkorb"){ mailListeZeichnen(); if(mailGewaehlt) mailOeffnen(mailGewaehlt); }
}

function verdrahten(){
  document.querySelectorAll('input[type=radio][name^="opt_"]').forEach(r=>{
    r.onchange = ()=>{
      const id = r.name.slice(4);
      S.wahl[id] = S.wahl[id]||{}; S.wahl[id].option = +r.value;
      document.getElementById("inhalt").innerHTML = REITER.entscheide();
      verdrahten(); warnbalkenRendern();
    };
  });
  document.querySelectorAll("textarea[data-b]").forEach(t=>{
    const id = t.dataset.b;
    const pruefen = ()=>{
      const n = t.value.trim().length;
      const z = document.getElementById("z_"+id);
      if(z){ z.textContent = n>=40 ? n+" Zeichen" : "Noch "+(40-n)+" Zeichen bis zur Mindestlänge";
             z.className = "zaehler"+(n>=40?"":" fehlt"); }
      const btn = document.getElementById("abschluss");
      if(btn) btn.disabled = !alleEntschieden();
      const st = document.getElementById("abschlussStatus");
      if(st) st.textContent = alleEntschieden()?"":"Erst wenn jeder Entscheid gewählt und begründet ist.";
    };
    t.oninput = ()=>{ S.wahl[id]=S.wahl[id]||{}; S.wahl[id].begruendung=t.value; pruefen(); warnbalkenRendern(); };
    pruefen();
  });
  const b1 = document.getElementById("abschluss");
  if(b1){ b1.disabled = !alleEntschieden(); b1.onclick = periodeAbschliessen; }
  const b2 = document.getElementById("abschlussZwei");
  if(b2) b2.onclick = ()=>{ if(alleEntschieden()) periodeAbschliessen(); else {aktiverReiter="entscheide"; zeichnen();} };
  document.querySelectorAll("[data-gehe]").forEach(b=>b.onclick=()=>{aktiverReiter=b.dataset.gehe; zeichnen();});

  const preis = document.getElementById("preis");
  if(preis) preis.oninput = ()=>{ S.preisindex=+preis.value/100; document.getElementById("preisWert").textContent=preis.value+" %"; };
  const ziel = document.getElementById("ziel"); if(ziel) ziel.onchange = ()=>S.zahlungszielTage=+ziel.value;
  const sch = document.getElementById("schicht"); if(sch) sch.onchange = ()=>S.zweiSchicht = sch.value==="1";
  const mk = document.getElementById("marketing"); if(mk) mk.onchange = ()=>S.marketingQuartal=+mk.value||0;

  const lohn = document.getElementById("lohn");
  if(lohn){
    const zeigen = ()=>{
      S.lohnindex = +lohn.value/100;
      document.getElementById("lohnWert").textContent = lohn.value+" %";
      const delta = (S.lohnindex-1)*9170000;
      document.getElementById("lohnKosten").textContent = delta===0 ? "Unverändert gegenüber dem Startniveau."
        : (delta>0?"Mehrkosten ":"Minderkosten ")+"von rund CHF "+fmt(Math.abs(delta))+" pro Jahr.";
    };
    lohn.oninput = zeigen; zeigen();
  }
  const wb = document.getElementById("weiterbildung"); if(wb) wb.onchange = ()=>S.weiterbildungQuartal=+wb.value||0;
  const au = document.getElementById("ausschreibungen"); if(au) au.onchange = ()=>S.ausschreibungen=+au.value||0;
  const uz = document.getElementById("ueberzeit"); if(uz) uz.onchange = ()=>S.ueberzeitAuszahlen=uz.checked;

  ["fUngelesen","ungelesen"],["fMarkiert","markiert"],["fOffen","offen"];
  [["fUngelesen","ungelesen"],["fMarkiert","markiert"],["fOffen","offen"]].forEach(([kid,key])=>{
    const k = document.getElementById(kid);
    if(k) k.onclick = ()=>{ mailFilter[key]=!mailFilter[key]; k.setAttribute("aria-pressed",mailFilter[key]); mailListeZeichnen(); };
  });
  const su = document.getElementById("suche");
  if(su) su.oninput = e=>{ mailFilter.text = e.target.value; mailListeZeichnen(); };
  const ar = document.getElementById("wzArchiv");
  if(ar) ar.onclick = ()=>{
    if(!mailGewaehlt) return;
    S.archiviert.push(mailGewaehlt); mailGewaehlt = null;
    document.getElementById("mailLesen").innerHTML = `<div class="leerfenster">Nachricht archiviert. Sie bleibt in der Auswertung enthalten.</div>`;
    mailListeZeichnen();
  };
  const aw = document.getElementById("wzAuswertung"); if(aw) aw.onclick = ()=>postkorbAuswerten(false);
  const uk = document.getElementById("uhrKnopf");
  if(uk) uk.onclick = ()=>{ uhrLaeuft=!uhrLaeuft; uk.textContent = uhrLaeuft?"Anhalten":"Starten"; };

  const em = document.getElementById("exportMd"); if(em) em.onclick = journalExportieren;
  const ej = document.getElementById("exportJson"); if(ej) ej.onclick = standExportieren;
}

function periodeAbschliessen(){
  // Postkorb-Einstufungen ins Journal
  postkorbListe().forEach(n=>{
    const b = S.postkorb[n.id];
    if(b && b.prio && (b.notiz||"").trim().length>=25){
      S.journal.push({quartal:QUARTALE[S.periode], titel:"Postkorb: "+n.betreff, art:"postkorb",
        hkb:"G3 Arbeitstechniken · G4 Probleme lösen · Prüfungsteil 4",
        gewaehlt:"Priorität "+b.prio+" · "+(AKTIONSNAME[b.aktion]||"–"), begruendung:b.notiz.trim()});
    }
  });
  offeneEreignisse().forEach(ev=>{
    const w = S.wahl[ev.id];
    ev.optionen[w.option].wirkung(S);
    S.erledigt.push(ev.id);
    S.journal.push({quartal:QUARTALE[S.periode], titel:ev.titel, hkb:ev.hkb, art:ev.art,
      gewaehlt:ev.optionen[w.option].label, begruendung:w.begruendung.trim()});
  });
  periodeRechnen();
  S.periode++;
  if(S.periode>=QUARTALE.length){ S.periode = QUARTALE.length-1; S.beendet = true; }
  mailGewaehlt = null; uhrLaeuft = false; restSekunden = K.postkorbMinuten*60;
  aktiverReiter = "lage"; zeichnen(); window.scrollTo({top:0});
}

function herunterladen(name,inhalt,typ){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([inhalt],{type:typ}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function journalExportieren(){
  let t = "Entscheidungsjournal – Bärtschi Metalltech AG\n\n";
  S.journal.forEach(j=>{
    t += j.quartal+"\n"+j.titel+"\nHandlungskompetenzen: "+j.hkb+"\nEntscheid: "+j.gewaehlt+"\nBegründung: "+j.begruendung+"\n\n";
  });
  t += "\nVerlauf\n";
  S.ergebnisse.forEach(r=>{
    t += r.quartal+": Umsatz "+fmt(r.umsatz)+", EBIT "+fmt(r.ebit)+", Gewinn "+fmt(r.gewinn)+
         ", Auslastung "+pct(r.auslastung,0)+", Termintreue "+pct(r.termintreue,0)+
         ", Motivation "+pct(r.motivation,0)+", Fluktuation "+pct(r.fluktuation)+", Bestand "+r.personen+"\n";
  });
  herunterladen("entscheidungsjournal.txt", t, "text/plain;charset=utf-8");
}
function standExportieren(){ herunterladen("spielstand.json", JSON.stringify(S,null,2), "application/json"); }

zeichnen();
</script>
</body>
</html>
